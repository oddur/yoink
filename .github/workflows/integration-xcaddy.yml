name: integration-xcaddy

# End-to-end coverage of the xcaddy feature. Compiles a 1-plugin
# caddy image against the runner's local docker daemon and asserts
# the resulting `yoink-caddy:<hash>` is cached locally with the right
# labels. Slow (~3-5 min for a fresh compile), so gated behind a
# Cargo feature flag and run only on PRs that touch the relevant
# code paths plus weekly to catch upstream drift.

on:
  pull_request:
    paths:
      - "yoink/src/proxy/xcaddy.rs"
      - "yoink/src/proxy/caddy.rs"
      - "yoink/src/docker_ops.rs"
      - "yoink/src/config.rs"
      - "yoink/tests/xcaddy_integration.rs"
      - ".github/workflows/integration-xcaddy.yml"
  schedule:
    # Weekly Mon 04:00 UTC — catches xcaddy / caddy:2-builder upstream
    # changes between user-driven PRs.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: integration-xcaddy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub-hosted ubuntu-latest ships docker preinstalled and the
    # runner user is already in the `docker` group; no setup needed.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      # Pre-pull `caddy:2-builder` so the integration test's first
      # bollard `POST /build` doesn't bundle the upstream pull into
      # the timing — keeps the test failure mode "build succeeded vs
      # failed" rather than "registry was slow."
      - name: Pre-pull caddy:2-builder
        run: docker pull caddy:2-builder
      - name: Run xcaddy integration test
        run: |
          cargo test \
            -p yoink \
            --features integration_xcaddy \
            --test xcaddy_integration \
            -- --nocapture
        timeout-minutes: 15
