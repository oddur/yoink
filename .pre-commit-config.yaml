# Local Claude session state is not source-controlled prose; skip
# whitespace/EOF/JSON-strict checks across that whole subtree.
exclude: ^\.claude/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        args: ["--all"]
        pass_filenames: false
      # Workspace clippy is too slow for every commit; runs on push instead.
      # `cargo check` would be redundant — clippy runs the same frontend.
      - id: clippy
        args: ["--workspace", "--all-targets", "--", "-D", "warnings"]
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.95.2
    hooks:
      # Scans the commits that the push sends, at pre-push.
      #
      # Two things made the old entry scan nothing:
      # - trufflehog sees `PRE_COMMIT=1` and switches to a mode for the
      #   pre-commit stage, where it looks at staged changes only. At
      #   pre-push nothing is staged. `env -u PRE_COMMIT` turns that off.
      # - `--since-commit HEAD` is an empty range.
      #
      # pre-commit gives the pushed range in PRE_COMMIT_FROM_REF and
      # PRE_COMMIT_TO_REF. They are empty on the first push of a repo,
      # and then the whole history is scanned.
      - id: trufflehog
        entry: >-
          bash -c 'if [ -n "$PRE_COMMIT_FROM_REF" ]; then
          set -- --since-commit "$PRE_COMMIT_FROM_REF" --branch "$PRE_COMMIT_TO_REF";
          else set --; fi;
          exec env -u PRE_COMMIT trufflehog git file://. "$@"
          --results=verified --fail --trust-local-git-config'
        always_run: true
        stages: [pre-push]
