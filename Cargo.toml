[workspace]
resolver = "3"
members = ["yoink"]

[workspace.package]
version = "0.20.5"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Oddur Magnusson"]
repository = "https://github.com/oddur/yoink"
homepage = "https://github.com/oddur/yoink"
readme = "README.md"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
module_name_repetitions = "allow"
# `Duration::from_secs(60)` for human-readable defaults (no `from_minutes` exists).
duration_suboptimal_units = "allow"
# Public surface is small and exposed types are self-explanatory; we add
# # Errors sections where they add information.
missing_errors_doc = "allow"
# Internal panics on poisoned mutexes / impossible states — not worth
# documenting for every helper.
missing_panics_doc = "allow"
# Test fixtures use `r#"..."#` for YAML strings; the hash count
# uniformity is more readable than per-string trimming.
needless_raw_string_hashes = "allow"
# CLI subcommand handlers compose through several `await` points and end
# up with futures > the pedantic 16 KiB threshold. Each is invoked once
# per process, so the stack-size concern doesn't apply — boxing every
# handler would be churn for no real win.
large_futures = "allow"

[workspace.lints.rust]
unsafe_code = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
