version: "3"

# Tasks assume you're inside `devbox shell` so cargo + rustup are on PATH.

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  check:
    desc: Check the workspace
    cmds:
      - cargo check --workspace

  fmt:
    desc: Check formatting
    cmds:
      - cargo fmt --all -- --check

  clippy:
    desc: Run clippy lints (warnings are errors)
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  test:
    desc: Run unit + integration tests (DinD e2e excluded)
    cmds:
      - cargo test --workspace

  test:e2e:
    desc: Run end-to-end DinD tests (requires Docker daemon)
    cmds:
      - cargo test --workspace -- --ignored --show-output

  run:
    desc: "Run yoink (usage: task yoink:run -- deploy --tag <sha> --config examples/yoink.toml)"
    cmds:
      - cargo run --quiet -- {{.CLI_ARGS}}

  tui:
    desc: "Launch the yoink TUI against the repo-root yoink.yaml"
    cmds:
      - cargo run --quiet -- tui --config ../../yoink.yaml {{.CLI_ARGS}}

  up:
    desc: "Reconcile every service against the repo-root yoink.yaml"
    cmds:
      - cargo run --quiet -- up --config ../../yoink.yaml {{.CLI_ARGS}}

  status:
    desc: "Show what's running on each host (repo-root yoink.yaml)"
    cmds:
      - cargo run --quiet -- status --config ../../yoink.yaml

  preflight:
    desc: "Verify Docker is reachable on each host (repo-root yoink.yaml)"
    cmds:
      - cargo run --quiet -- preflight --config ../../yoink.yaml

  prune:
    desc: "Remove yoink-managed containers no longer in config (pass `-- --dry-run` to preview)"
    cmds:
      - cargo run --quiet -- prune --config ../../yoink.yaml {{.CLI_ARGS}}

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean
