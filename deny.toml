[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
ignore = [
    # `proc-macro-error 1.x` is unmaintained but still pulled in by
    # `tabled` (transitive: `tabled_derive` → `proc-macro-error`).
    # No safe upgrade exists upstream; tracked for replacement when
    # `tabled` migrates or an alternative table renderer fits.
    "RUSTSEC-2024-0370",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",  # webpki-roots — Mozilla's CA bundle as a Rust crate
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
