[workspace]
members = ["cargo:."]

# Config for 'dist' (https://opensource.axo.dev/cargo-dist/)
[dist]
cargo-dist-version = "0.31.0"
ci = "github"
# Installers to generate. Shell installer for `curl … | sh`,
# Homebrew formula auto-published to a tap repo.
installers = ["shell", "homebrew"]
# Tap repo that receives the generated formula on each release.
tap = "oddur/homebrew-yoink"
# Where the formula goes inside the tap repo (default Formula/).
formula = "yoink"
# Target platforms. Drop windows (no story for yoink yet) + the
# aarch64-linux variant (less common; add when an arm64 server use
# case appears).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Tap auto-publish is intentionally not in publish-jobs yet: it needs
# a HOMEBREW_TAP_TOKEN secret with write access to oddur/homebrew-yoink.
# The formula is still generated as a release asset; users can either
# install it manually, or (once the secret is set) re-enable here:
#   publish-jobs = ["homebrew"]
install-updater = false
