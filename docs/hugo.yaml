# Yoink documentation site, built with Hugo + Hextra. Self-hosted on
# GitHub Pages off the `oddur/yoink` repo (no custom domain). The
# Hextra theme is pulled in as a Hugo module — `hugo mod tidy` resolves
# it from the registry; `hugo --gc --minify` builds for prod.
baseURL: "https://oddur.github.io/yoink/"
title: 🪝 yoink
languageCode: en-us

# Hextra wants Goldmark with unsafe HTML enabled for callouts, and
# pretty-printing handled by chroma.
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github
    lineNos: false
    noClasses: false

enableRobotsTXT: true
enableGitInfo: true

# Pull Hextra in as a Hugo module. Pinned to whatever `hugo mod tidy`
# resolves at build time — refresh by running `hugo mod tidy` locally
# and committing the updated go.sum.
module:
  imports:
    - path: github.com/imfing/hextra

# Top-level menu. Hextra renders this as the main nav.
menu:
  main:
    - name: Intro
      pageRef: /docs/intro
      weight: 1
    - name: Start
      pageRef: /docs/start
      weight: 2
    - name: Guide
      pageRef: /docs/guide
      weight: 3
    - name: How-to
      pageRef: /docs/how-to
      weight: 4
    - name: Reference
      pageRef: /docs/reference
      weight: 5
    - name: About
      pageRef: /about
      weight: 6
    - name: Search
      weight: 9
      params:
        type: search
    - name: GitHub
      weight: 10
      url: "https://github.com/oddur/yoink"
      params:
        icon: github

params:
  description: "A small, opinionated container deploy CLI + TUI."
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
  page:
    width: normal
  theme:
    default: system
    displayToggle: true
  editURL:
    enable: true
    base: "https://github.com/oddur/yoink/edit/main/docs/content"
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
