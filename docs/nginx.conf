server {
    listen 80;
    root /usr/share/nginx/html;

    # Prerendered pages land as <route>/index.html; assets have content-hash
    # names. Try the exact file, then the directory index, then fall back to
    # the SPA shell so client-side routing handles the rest.
    location / {
        try_files $uri $uri/index.html /_shell.html;
    }

    # Hashed asset bundles — safe to cache forever in the browser.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
