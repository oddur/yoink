server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Astro prerenders every page as <route>/index.html. Try the exact
    # file, then the directory index. There is no SPA shell: an unknown
    # path is a real 404.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # The docs moved to the four Diátaxis sections. Old addresses redirect,
    # for pages and for their Markdown copies under /llms.mdx.
    rewrite ^(/llms\.mdx)?/docs/start/first-deploy(/.*)?$ $1/docs/tutorials/first-deploy$2 permanent;
    rewrite ^(/llms\.mdx)?/docs/start/install(/.*)?$ $1/docs/how-to/install$2 permanent;
    rewrite ^(/llms\.mdx)?/docs/start(/.*)?$ $1/docs/tutorials$2 permanent;
    rewrite ^(/llms\.mdx)?/docs/how-to/(hetzner-quickstart|tanstack-stack)(/.*)?$ $1/docs/tutorials/$2$3 permanent;
    rewrite ^(/llms\.mdx)?/docs/(intro|guide)(/.*)?$ $1/docs/explanation$3 permanent;
    rewrite ^(/llms\.mdx)?/docs/examples(/.*)?$ $1/docs/reference/examples$2 permanent;
    rewrite ^(/llms\.mdx)?/docs/troubleshooting(/.*)?$ $1/docs/how-to/troubleshooting$2 permanent;

    error_page 404 /404.html;

    # Content-hashed bundles and fonts: safe to cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Markdown copies of the docs for agents (/llms.mdx/docs/<page>/content.md).
    location /llms.mdx/ {
        default_type "text/markdown; charset=utf-8";
        try_files $uri =404;
    }
}
