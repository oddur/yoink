# Throwaway test config for yoink against the production host
# `backtrack-eu-1` (Hetzner, joined to your Tailscale tailnet, ssh as root).
#
# Deploys a vanilla `nginx:alpine` container so you can exercise the full
# yoink lifecycle (preflight → pull → run → healthcheck → swap → logs)
# without touching anything Kamal manages. Two layers of isolation:
#
#  * `service.name = "yoink-test"`  — distinct label set; Kamal's bt-api
#    container is `service=backtrack` and won't be touched.
#  * `deploy.network = "yoink-test"` — separate Docker network from
#    Kamal's `kamal` network. Caddy doesn't see this; nothing public.
#
# Suggested smoke run from `tools/yoink/`:
#
#   cargo run -- preflight --config examples/backtrack-eu-1-nginx.toml
#   cargo run -- deploy --tag alpine --config examples/backtrack-eu-1-nginx.toml
#   cargo run -- status --config examples/backtrack-eu-1-nginx.toml
#   cargo run -- tui --mode logs --config examples/backtrack-eu-1-nginx.toml
#   cargo run -- deploy --tag alpine-slim --config examples/backtrack-eu-1-nginx.toml
#   cargo run -- rollback --config examples/backtrack-eu-1-nginx.toml
#
# Cleanup when done (ssh into the host once):
#
#   ssh root@backtrack-eu-1 \
#     'docker ps -aq --filter label=yoink.service=yoink-test | xargs -r docker rm -f && \
#      docker network rm yoink-test 2>/dev/null'
#
# Note: `--tag alpine` doubles as the yoink version label (we don't
# require git SHAs); the container will be named `yoink-test-alpine`.

[service]
name = "yoink-test"
image = "nginx"

[deploy]
healthcheck_path = "/"
healthcheck_timeout = "30s"
drain_timeout = "5s"
network = "yoink-test"

[[hosts]]
address = "backtrack-eu-1"
user = "root"

[run]
port = 80

[run.options]
cap_drop = ["ALL"]
cap_add = ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
security_opt = ["no-new-privileges"]
# nginx writes to /var/cache/nginx and /var/run/nginx.pid at startup.
# Leaving rootfs writable for this test (the default) keeps the config
# minimal; flip read_only=true and add tmpfs mounts for those paths if
# you want to mirror bt-api's hardening.
