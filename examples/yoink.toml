# Example yoink.toml — single service, single host, hardened defaults.
# `[run.options]` mirrors the security-opt / cap-drop / read-only / tmpfs
# pattern used in backtrack-deploy/config/deploy.yml for bt-api.

[service]
name = "app-a"
image = "registry.example.com/app-a"

[deploy]
strategy = "parallel"
healthcheck_path = "/health"
healthcheck_timeout = "60s"
drain_timeout = "15s"
on_failure = "halt"
network = "yoink"

[[hosts]]
address = "host-a"
user = "deploy"

[secrets]
provider = "infisical"
project_id = "PROJECT_ID"
environment = "prod"
path = "/app-a"

[caddy]
labels = [
  "caddy=app-a.example.com",
  "caddy.reverse_proxy={{upstreams 3000}}",
]

[run]
port = 3000

[run.options]
memory = "512m"
cap_drop = ["ALL"]
security_opt = ["no-new-privileges"]
read_only = true
network_aliases = ["api"]

[run.options.tmpfs]
"/tmp" = "size=64m,mode=1777"
