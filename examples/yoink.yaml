# Example yoink.yaml — multi-service config.
#
# Every entry under `services:` is reconciled the same way. yoink hashes
# the desired spec, compares to the running container's
# yoink.spec_hash label, and swaps drifted ones via the
# healthcheck-gated loop. Versioned app code (api, web) and stable
# infrastructure (caddy, redis) live side-by-side.

deploy:
  networks: [yoink]

hosts:
  - address: host-a
    user: deploy

# Uncomment to compile a custom caddy on each proxy host with extra
# modules baked in — rate-limit, l4, redis-storage, third-party DNS
# providers. No registry needed: each host runs xcaddy in a builder
# container and tags the result locally. See docs/guide/proxy.md.
#
# proxy:
#   email: ops@example.com
#   xcaddy:
#     plugins:
#       - github.com/caddyserver/caddy-l4
#       - github.com/mholt/caddy-ratelimit@v0.1.0
#       - github.com/caddy-dns/cloudflare

secrets:
  # Default: a sealed `secrets.age` file in the repo, decrypted at
  # deploy time with one age identity sourced from
  # `YOINK_AGE_KEY` / `YOINK_AGE_KEY_FILE` / `~/.config/yoink/age.key`.
  # See `docs/recipes/sealed-secrets.md` for the full flow.
  provider: age
  recipients:
    - age1examplepublickeyreplacewithyourown000000000000000000000000

  # Alternative: bring-your-own-tool. yoink invokes the command and
  # parses the resulting bundle from stdout (auto-detects dotenv vs
  # JSON). Recipes for 1Password, Doppler, Vault, AWS Secrets
  # Manager, Infisical CLI, etc. live under `docs/recipes/secrets-…`.
  #
  # provider: command
  # command: ["doppler", "secrets", "download", "--no-file", "--format", "env"]

# ─── pre-deploy hooks ────────────────────────────────────────────────
# Run before any service deploys. One-shot containers; must exit 0
# to proceed.
hooks:
  pre_deploy:
    - name: schema-migrate
      image: registry.example.com/app-a
      tag: { service: api }   # pin to the api service's deploy tag
      entrypoint: [/usr/local/bin/migrate]
      secrets: [DATABASE_MIGRATE_URL]

services:
  # ─── application service (CLI `--tag <sha>` overrides) ────────────
  - name: api
    image: registry.example.com/app-a
    tag: latest
    secrets: [DATABASE_URL, AUTH_JWKS_URL]
    env:
      RUST_LOG: info
      PORT: "3000"
      REDIS_URL: redis://redis:6379
    run:
      port: 3000
      healthcheck_path: /health
      healthcheck_timeout: 60s
      drain_timeout: 15s
      options:
        network_aliases: [api]
        memory: 512m
        cap_drop: [ALL]
        security_opt: [no-new-privileges]
        read_only: true
        tmpfs:
          /tmp: size=64m,mode=1777

  # ─── stable infrastructure service ────────────────────────────────
  - name: redis
    image: redis
    tag: 7-alpine
    run:
      cmd:
        - redis-server
        - --maxmemory
        - 256mb
        - --maxmemory-policy
        - allkeys-lru
        - --save
        - ""
        - --appendonly
        - "no"
      options:
        memory: 300m
        cap_drop: [ALL]
        security_opt: [no-new-privileges]
        read_only: true
        tmpfs:
          /data: size=32m,mode=1777
