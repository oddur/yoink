name: postgres
kind: accessory
description: PostgreSQL with sealed credentials and a named volume for data.

variables:
  - name: service_name
    prompt: Service name
    default: postgres
    pattern: "^[a-z][a-z0-9-]*$"
  - name: database
    prompt: Default database name
    default: app
    pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
  - name: user
    prompt: Database user
    default: app
    pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
  - name: memory
    prompt: Memory limit
    default: 512m
  - name: wal_archiving
    prompt: |
      Enable continuous WAL archiving to S3-compatible storage? Pairs with
      a volume-level base backup (e.g. `yoink add restic-backups`) for
      point-in-time recovery. Set to "true" to render the archive_command
      wiring into the service.
    default: "false"
    pattern: "^(true|false)$"
  - name: wal_repository
    prompt: |
      S3 URI prefix for WAL segments (e.g. `s3://my-wal-bucket` or
      `s3://wal-archive` against a self-hosted RustFS). Ignored when
      wal_archiving=false.
    default: "s3://wal-archive"
  - name: wal_endpoint
    prompt: |
      Custom S3 endpoint URL for non-AWS providers (e.g. `http://rustfs:9000`
      for in-network RustFS, or `https://s3.eu-central-003.backblazeb2.com`
      for B2). Leave empty for AWS S3. Ignored when wal_archiving=false.
    default: ""

files:
  - dest: "services/{{ service_name }}.yaml"
    template: service.yaml.tmpl

secrets:
  - name: "{{ service_name | upper }}_PASSWORD"
    generate: "random:32"

include_glob: "services/*.yaml"

connection:
  depends_on: ["{{ service_name }}"]
  env:
    POSTGRES_DB: "{{ database }}"
    POSTGRES_HOST: "{{ service_name }}"
    POSTGRES_PORT: "5432"
    POSTGRES_USER: "{{ user }}"
  env_from_secrets:
    POSTGRES_PASSWORD: "{{ service_name | upper }}_PASSWORD"

notes: |
  {%- if wal_archiving == "true" %}
  WAL archiving is enabled. Two operator-supplied secrets must be sealed
  before `yoink up`:
    yoink secrets edit
    #  S3_ACCESS_KEY_ID=…
    #  S3_SECRET_ACCESS_KEY=…
  WAL segments ship to {{ wal_repository }}{% if wal_endpoint %} via
  endpoint {{ wal_endpoint }}{% endif %}. The bucket must exist before
  postgres starts archiving — restic-style auto-init does not apply here.

  Pair with a base backup of the data volume for point-in-time recovery:
    yoink add restic-backups
  Then in services/backups.yaml, bind `pgdata-{{ service_name }}` read-only
  into /data. WAL segments + restic snapshot = PITR.
  {%- else %}
  Backup tip: `yoink exec {{ service_name }} -- pg_dump -U {{ user }} {{ database }}`
  {%- endif %}
