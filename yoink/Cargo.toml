[package]
name = "yoink"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
readme = { workspace = true }
description = "Small, opinionated container deploy CLI for a handful of services on a handful of hosts."

[lib]
name = "yoink"
path = "src/lib.rs"

[[bin]]
name = "yoink"
path = "src/main.rs"

[dependencies]
age = { version = "0.11", features = ["armor"] }
ansi-to-tui = "8"
anyhow = "1"
async-trait = "0.1"
bollard = { version = "0.20", features = ["ssh"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
flate2 = "1"
glob = "0.3"
humantime = "2"
humantime-serde = "1"
indicatif = "0.18"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
ratatui = "0.30"
throbber-widgets-tui = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tabled = "0.16"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tui-term = "0.3"
vt100 = "0.16"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time", "fs", "process", "io-util", "io-std"] }
tokio-util = { version = "0.7", features = ["io"] }
yaml_serde = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
pretty_assertions = "1"
testcontainers = "0.27"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }

# Tests gated behind `--features integration_xcaddy` need a real local
# Docker daemon. CI runs them in a dedicated workflow; locally, run with
# `cargo test -p yoink --features integration_xcaddy --test xcaddy_integration`.
[features]
integration_xcaddy = []

[lints]
workspace = true
